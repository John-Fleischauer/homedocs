name: homedocs

services:
  app:
    # Built and pushed by GitHub Actions. No `build:` block: this stack only pulls.
    image: ${APP_IMAGE:-ghcr.io/john-fleischauer/homedocs:main}
    # `:main` is a mutable tag and `docker compose up` will not re-pull a tag that
    # already exists locally. Without this the redeploy keeps running old code.
    pull_policy: always
    restart: unless-stopped
    environment:
      # The password travels beside the URL, not inside it: postgres-js parses the
      # URL with `new URL()`, and a `/` in the password breaks it.
      DATABASE_URL: postgres://homedocs@db:5432/homedocs
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Required secrets have no default: compose refuses to start without them,
      # and lib/env.ts checks them again at boot (each at least 32 characters).
      # Rotating SESSION_SECRET signs everyone out, the claude.ai connector included.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      # Encrypts stored secrets and integration tokens. Separate from
      # SESSION_SECRET so signing everyone out does not destroy them. Back it up.
      INTEGRATIONS_KEY: ${INTEGRATIONS_KEY:?set INTEGRATIONS_KEY}
      # The external HTTPS origin, no path. OAuth discovery and share links are
      # built from it, so there is no default: a wrong origin sends claude.ai to
      # the wrong host.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      DATA_DIR: /data
      # Where the pre-migration dump is written (lib/db/migrate.ts): on the
      # `files` volume, so it outlives the container and is in the host's snapshots.
      BACKUP_DIR: /data/backups
      # Proxies in front of the app; the client address is that many entries from
      # the right of X-Forwarded-For. Ignored while CLIENT_IP_HEADER is set.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # A header the proxy in front sets to the client address on every request
      # (production: x-real-ip; docs/DEPLOYMENT.md, Client address).
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # Single sign-on. Off unless issuer, id and secret are all set; two of three
      # fails the boot. Redirect URI: ${PUBLIC_BASE_URL}/login/oidc/callback.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-}
      OIDC_ONLY: ${OIDC_ONLY:-}
      OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
      # The role Family suggests when letting in someone a sign-on left waiting: viewer (default) or member.
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-}
      TZ: ${TZ:-America/New_York}
    volumes:
      - files:/data
    healthcheck:
      # The entrypoint applies migrations before the server listens, hence the
      # longer start_period.
      test:
        ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
    # The reverse proxy reaches the app over the shared `web` network as
    # homedocs-app-1:3000 (alias `homedocs`). No published port: the proxy sets
    # X-Real-IP, which the app trusts, so the app must not be reachable except
    # through the proxy.
    networks:
      default:
      web:
        aliases: [homedocs]

  db:
    # Pinned major, no `pull_policy`: a Postgres upgrade is planned work, not a
    # side effect of a redeploy.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: homedocs
      # Sets the password only when the cluster is first created; changing it
      # later also needs ALTER ROLE in the database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: homedocs
    volumes:
      # PG18 keeps data in a version subdirectory and wants the mount at
      # /var/lib/postgresql, not /var/lib/postgresql/data.
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homedocs']
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  # The reverse proxy's network, created outside this stack.
  web:
    external: true

# The host's daily snapshots back these up (docs/DEPLOYMENT.md, Backups).
volumes:
  pgdata18:
  files:
